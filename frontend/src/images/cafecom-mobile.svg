<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">CafeCom Mobile App</title>
  <desc id="desc">Portada visual para el proyecto móvil CafeCom.</desc>
  <defs>

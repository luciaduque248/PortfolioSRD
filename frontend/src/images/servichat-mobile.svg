<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ServiChat Mobile App</title>
  <desc id="desc">Portada visual para el proyecto móvil ServiChat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2450"/>
      <stop offset="0.55" stop-color="#4B3AA7"/>
      <stop offset="1" stop-color="#7667E9"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
